<!DOCTYPE html>
<html>
    <head>
        <title>Boston Institutional Care Records</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="topnav">
            <a href="home.html">Home</a>
            <a href="historicalbackground.html" >Historical Background</a>
            <a href= "database.html" class= "active">Database</a>
            <a href="about.html">About</a>
        </div>
        <div class="content"> 
            <input type="text" id="search-box" placeholder="Search by name...">
            <div id="result-count"></div>
            <div id="results-list"></div>
        </div>
        <h1 class="site-title">Database</h1>
        <p>here will be a link/embedded file of the database that I have created.</p>
      

      <iframe 
        class="nc-embed" 
        src="https://app.nocodb.com/nc/view/429a000e-2d8a-409e-8afd-6a6914523619" 
        width="100" 
        height="700" 
        style="background: transparent; border: 1px solid #ddd">
      </iframe>
      
        <script>
            
            
let allChildren = [];
function renderList(children) {
  document.getElementById('result-count').textContent = children.length + ' records';

  document.getElementById('results-list').innerHTML = children.map(function(person) {
    return '<div>' + person.Name + ' — ' + person.Institutions + '</div>';
  }).join('');
}
fetch('children.json')
  .then(function(response) { return response.json(); })
  .then(function(data) {
    allChildren = data;
      renderList(allChildren);
    console.log(allChildren);
  });
  
  document.getElementById('search-box').addEventListener('input', function(e) {
  const query = e.target.value.toLowerCase();

  const matches = allChildren.filter(function(person) {
    return person.Name.toLowerCase().includes(query);
  });

  renderList(matches);
});
</script>
    </body>
</html>
